<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Fall Monitor</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d9e0ea;
      --fall: #c2410c;
      --suspected: #a16207;
      --normal: #047857;
      --handled: #475569;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .dot.online { background: var(--normal); }
    .dot.offline { background: #dc2626; }

    main {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 20px 24px 28px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .metric .value {
      font-size: 26px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 11px;
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .column {
      min-width: 0;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .column-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .column-count {
      color: var(--muted);
      font-size: 13px;
    }

    .events {
      display: grid;
      gap: 10px;
    }

    .event {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 6px solid var(--suspected);
      border-radius: 8px;
      padding: 12px;
    }

    .event.fall { border-left-color: var(--fall); }
    .event.handled {
      opacity: 0.68;
      border-left-color: var(--handled);
    }

    .video-button, video, .clip-preview, .empty-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111827;
      border-radius: 6px;
      object-fit: contain;
      display: block;
    }

    .video-button {
      display: grid;
      place-items: center;
      color: #e5e7eb;
      text-align: center;
      padding: 10px;
    }

    .video-button strong {
      display: block;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .video-button span {
      color: #cbd5e1;
      font-size: 12px;
    }

    .empty-video {
      display: grid;
      place-items: center;
      color: #cbd5e1;
      font-size: 13px;
    }

    .event-main {
      min-width: 0;
    }

    .row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: var(--suspected);
      text-transform: uppercase;
    }

    .badge.fall { background: var(--fall); }
    .badge.normal { background: var(--normal); }
    .badge.handled { background: var(--handled); }

    .event-title {
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 14px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .grid strong {
      color: var(--text);
      font-weight: 600;
    }

    .reason {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .event-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      grid-column: 1 / -1;
    }

    .probability {
      font-size: 13px;
      color: var(--muted);
    }

    .probability strong {
      display: block;
      color: var(--text);
      font-size: 26px;
      margin-top: 2px;
    }

    .empty {
      padding: 32px;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .latest {
      margin-bottom: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      max-height: 142px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .latest-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 130px 150px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .latest-row:first-child { border-top: 0; }

    .latest-main {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .latest-time {
      color: var(--muted);
      text-align: right;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.72);
      z-index: 50;
    }

    .modal.open { display: grid; }

    .modal-panel {
      width: min(1120px, 96vw);
      max-height: 92vh;
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .modal-body {
      padding: 14px;
      background: #0f172a;
    }

    .modal-body img,
    .modal-body video {
      width: 100%;
      max-height: 76vh;
      object-fit: contain;
      background: #000000;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main { padding: 16px; }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .columns {
        grid-template-columns: 1fr;
      }

      .event {
        grid-template-columns: 1fr;
      }

      .latest-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .latest-time { text-align: left; }

    }
  </style>
</head>
<body>
  <header>
    <h1>Community Fall Monitor</h1>
    <div class="connection"><span id="dot" class="dot"></span><span id="connectionText">Connecting</span></div>
  </header>

  <main>
    <section class="summary">
      <div class="metric"><div class="label">Total Events</div><div id="totalCount" class="value">0</div></div>
      <div class="metric"><div class="label">Open Alerts</div><div id="openCount" class="value">0</div></div>
      <div class="metric"><div class="label">Fall</div><div id="fallCount" class="value">0</div></div>
      <div class="metric"><div class="label">Suspected</div><div id="suspectedCount" class="value">0</div></div>
    </section>

    <div class="toolbar">
      <h2>Incoming Events</h2>
      <button id="reloadButton">Manual Sync</button>
    </div>

    <section id="latestEvents" class="latest">
      <div class="empty">No events received.</div>
    </section>

    <section class="columns">
      <div class="column">
        <div class="column-header">
          <h3>Suspected</h3>
          <span id="suspectedColumnCount" class="column-count">0 active</span>
        </div>
        <div id="suspectedEvents" class="events">
          <div class="empty">No suspected events.</div>
        </div>
      </div>
      <div class="column">
        <div class="column-header">
          <h3>Fall</h3>
          <span id="fallColumnCount" class="column-count">0 active</span>
        </div>
        <div id="fallEvents" class="events">
          <div class="empty">No fall alerts.</div>
        </div>
      </div>
    </section>
  </main>

  <div id="videoModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Event video</div>
        <button id="modalClose">Close</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const suspectedEventsEl = document.getElementById('suspectedEvents');
    const fallEventsEl = document.getElementById('fallEvents');
    const latestEventsEl = document.getElementById('latestEvents');
    const suspectedColumnCountEl = document.getElementById('suspectedColumnCount');
    const fallColumnCountEl = document.getElementById('fallColumnCount');
    const dotEl = document.getElementById('dot');
    const connectionTextEl = document.getElementById('connectionText');
    const reloadButton = document.getElementById('reloadButton');
    const videoModal = document.getElementById('videoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');
    const counts = {
      total: document.getElementById('totalCount'),
      open: document.getElementById('openCount'),
      fall: document.getElementById('fallCount'),
      suspected: document.getElementById('suspectedCount')
    };

    let events = [];
    let socket = null;
    let reconnectTimer = null;

    function setConnection(online, text) {
      dotEl.className = 'dot ' + (online ? 'online' : 'offline');
      connectionTextEl.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function formatProb(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'n/a';
      return Number(value).toFixed(3);
    }

    function upsertEvent(event) {
      const index = events.findIndex((item) => item.event_id === event.event_id);
      if (index >= 0) {
        events[index] = event;
      } else {
        events.unshift(event);
      }
      render();
    }

    function canReleaseVideo(event) {
      if (event.video_released || !event.video_release_at) return false;
      return Date.now() >= Date.parse(event.video_release_at);
    }

    function render() {
      const openEvents = events.filter((event) => !event.handled);
      counts.total.textContent = events.length;
      counts.open.textContent = openEvents.length;
      counts.fall.textContent = events.filter((event) => event.status === 'fall').length;
      counts.suspected.textContent = events.filter((event) => event.status === 'suspected').length;

      latestEventsEl.innerHTML = renderLatest(events.slice(0, 6));
      const suspectedEvents = events.filter((event) => event.status === 'suspected' && !event.handled);
      const fallEvents = events.filter((event) => event.status === 'fall' && !event.handled);
      suspectedColumnCountEl.textContent = `${suspectedEvents.length} active`;
      fallColumnCountEl.textContent = `${fallEvents.length} active`;
      suspectedEventsEl.innerHTML = renderList(suspectedEvents, 'No suspected events.');
      fallEventsEl.innerHTML = renderList(fallEvents, 'No fall alerts.');
    }

    function renderLatest(list) {
      if (!list.length) {
        return '<div class="empty">No events received.</div>';
      }
      return list.map((event) => {
        const status = event.status || 'suspected';
        const classifier = event.classifier || {};
        const llm = event.llm_review || {};
        const title = event.status === 'normal'
          ? 'Reviewed as normal'
          : event.status === 'fall'
            ? 'Fall alert'
            : 'Suspected alert';
        const detail = `${event.address || 'local demo'} · ${llm.status || 'no review'} · ${llm.reason || ''}`;
        return `
          <div class="latest-row">
            <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
            <div class="latest-main"><strong>${escapeHtml(title)}</strong> ${escapeHtml(detail)}</div>
            <div>p_fall <strong>${formatProb(classifier.p_fall)}</strong></div>
            <div class="latest-time">${escapeHtml(event.updated_at || event.timestamp || '')}</div>
          </div>
        `;
      }).join('');
    }

    function renderList(list, emptyText) {
      if (!list.length) {
        return `<div class="empty">${escapeHtml(emptyText)}</div>`;
      }
      return list.map((event) => {
        const status = event.status || 'suspected';
        const llm = event.llm_review || {};
        const classifier = event.classifier || {};
        const handled = event.handled ? ' handled' : '';
        const clip = renderVideoPane(event);
        const handledBadge = event.handled ? '<span class="badge handled">Handled</span>' : '';
        const actions = renderActions(event);

        return `
          <article class="event ${escapeHtml(status)}${handled}">
            <div>${clip}</div>
            <div class="event-main">
              <div class="row">
                <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
                ${handledBadge}
                <span class="event-title">${escapeHtml(event.address)}</span>
              </div>
              <div class="grid">
                <div>Client <strong>${escapeHtml(event.client_id)}</strong></div>
                <div>Device <strong>${escapeHtml(event.device_id)}</strong></div>
                <div>Time <strong>${escapeHtml(event.timestamp)}</strong></div>
                <div>Event <strong>${escapeHtml(event.event_id)}</strong></div>
                <div>Scenario <strong>${escapeHtml(event.scenario ?? 'n/a')}</strong></div>
                <div>Frame <strong>${escapeHtml(event.frame_index ?? 'n/a')}</strong></div>
              </div>
              <div class="reason"><strong>Qwen3-VL:</strong> ${escapeHtml(llm.status ?? 'n/a')} (${formatProb(llm.confidence)}) - ${escapeHtml(llm.reason ?? '')}</div>
            </div>
            <div class="event-actions">
              <div class="probability">3D classifier p_fall <strong>${formatProb(classifier.p_fall)}</strong></div>
              ${actions}
            </div>
          </article>
        `;
      }).join('');
    }

    function renderVideoPane(event) {
      if (event.clip_stream_url || event.clip_url) {
        return `
          <button class="video-button" data-open-video="${escapeHtml(event.event_id)}">
            <span><strong>Open video</strong>Click to view event clip</span>
          </button>
        `;
      }
      return '<div class="empty-video">No video released</div>';
    }

    function renderActions(event) {
      if (event.handled) return '<button disabled>Handled</button>';
      if (event.status === 'fall') {
        return `<button class="primary" data-handle="${escapeHtml(event.event_id)}">Mark handled</button>`;
      }
      if (!event.clip_url && !event.clip_stream_url && event._clip_url_raw) {
        if (event.video_release_at) {
          const remaining = Math.max(0, Math.ceil((Date.parse(event.video_release_at) - Date.now()) / 1000));
          if (remaining > 0) {
            return `<button disabled>Video in ${remaining}s</button>`;
          }
          return `<button class="primary" data-release-video="${escapeHtml(event.event_id)}">View video</button>`;
        }
        return `<button class="primary" data-request-video="${escapeHtml(event.event_id)}">Request video</button>`;
      }
      return `<button class="primary" data-handle="${escapeHtml(event.event_id)}">Mark handled</button>`;
    }

    async function reloadEvents() {
      const response = await fetch('/api/events');
      const data = await response.json();
      events = data.events || [];
      render();
    }

    async function markHandled(eventId) {
      await fetch(`/api/events/${encodeURIComponent(eventId)}/handled`, { method: 'POST' });
    }

    async function requestVideo(eventId) {
      await fetch(`/api/events/${encodeURIComponent(eventId)}/request-video`, { method: 'POST' });
    }

    async function releaseVideo(eventId) {
      const response = await fetch(`/api/events/${encodeURIComponent(eventId)}/release-video`, { method: 'POST' });
      const data = await response.json();
      if (data.event) {
        upsertEvent(data.event);
        openVideo(data.event.event_id);
      }
    }

    function openVideo(eventId) {
      const event = events.find((item) => item.event_id === eventId);
      if (!event) return;
      const streamUrl = event.clip_stream_url;
      const clipUrl = event.clip_url;
      if (!streamUrl && !clipUrl) return;
      modalTitle.textContent = `${event.status || 'event'} · ${event.address || event.event_id}`;
      if (streamUrl) {
        modalBody.innerHTML = `<img src="${escapeHtml(streamUrl)}" alt="event video stream">`;
      } else {
        modalBody.innerHTML = `<video src="${escapeHtml(clipUrl)}" controls autoplay muted playsinline></video>`;
      }
      videoModal.classList.add('open');
      videoModal.setAttribute('aria-hidden', 'false');
    }

    function closeVideo() {
      videoModal.classList.remove('open');
      videoModal.setAttribute('aria-hidden', 'true');
      modalBody.innerHTML = '';
    }

    function connect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${scheme}://${location.host}/ws/dashboard`);
      socket.onopen = () => setConnection(true, 'Connected');
      socket.onclose = () => {
        setConnection(false, 'Disconnected, retrying');
        reconnectTimer = setTimeout(connect, 1200);
      };
      socket.onerror = () => setConnection(false, 'Connection error');
      socket.onmessage = (message) => {
        const data = JSON.parse(message.data);
        if (data.type === 'snapshot') {
          events = data.events || [];
          render();
        } else if (data.type === 'event') {
          upsertEvent(data.event);
        } else if (data.type === 'handled') {
          upsertEvent(data.event);
        }
      };
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-handle]');
      if (button) markHandled(button.dataset.handle);
      const requestButton = event.target.closest('[data-request-video]');
      if (requestButton) requestVideo(requestButton.dataset.requestVideo);
      const releaseButton = event.target.closest('[data-release-video]');
      if (releaseButton) releaseVideo(releaseButton.dataset.releaseVideo);
      const openButton = event.target.closest('[data-open-video]');
      if (openButton) openVideo(openButton.dataset.openVideo);
    });

    modalClose.addEventListener('click', closeVideo);
    videoModal.addEventListener('click', (event) => {
      if (event.target === videoModal) closeVideo();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeVideo();
    });

    reloadButton.addEventListener('click', reloadEvents);
    setInterval(() => {
      if (events.some(canReleaseVideo)) render();
    }, 1000);
    reloadEvents().catch(() => {});
    connect();
  </script>
</body>
</html>
