<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Fall Monitor</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d9e0ea;
      --fall: #c2410c;
      --suspected: #a16207;
      --normal: #047857;
      --handled: #475569;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .dot.online { background: var(--normal); }
    .dot.offline { background: #dc2626; }

    main {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 20px 24px 28px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .metric .value {
      font-size: 26px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 11px;
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.pending {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

    button.warn {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    button.suspect {
      background: var(--suspected);
      border-color: var(--suspected);
      color: #ffffff;
    }

    button.suspect-warn {
      background: #fef3c7;
      border-color: var(--suspected);
      color: #854d0e;
    }

    button.danger {
      background: var(--fall);
      border-color: var(--fall);
      color: #ffffff;
    }

    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .column {
      min-width: 0;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .column-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .column-count {
      color: var(--muted);
      font-size: 13px;
    }

    .events {
      display: grid;
      gap: 10px;
    }

    .event {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 6px solid var(--suspected);
      border-radius: 8px;
      padding: 12px;
    }

    .event.fall { border-left-color: var(--fall); }
    .event.handled {
      opacity: 0.68;
      border-left-color: var(--handled);
    }

    .video-button, video, .clip-preview, .empty-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111827;
      border-radius: 6px;
      object-fit: contain;
      display: block;
    }

    .video-button {
      display: grid;
      place-items: center;
      color: #e5e7eb;
      text-align: center;
      padding: 10px;
    }

    .video-button strong {
      display: block;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .video-button span {
      color: #cbd5e1;
      font-size: 12px;
    }

    .empty-video {
      display: grid;
      place-items: center;
      color: #cbd5e1;
      font-size: 13px;
    }

    .event-main {
      min-width: 0;
    }

    .row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: var(--suspected);
      text-transform: uppercase;
    }

    .badge.fall { background: var(--fall); }
    .badge.normal { background: var(--normal); }
    .badge.handled { background: var(--handled); }

    .event-title {
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 14px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .grid strong {
      color: var(--text);
      font-weight: 600;
    }

    .reason {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .event-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      grid-column: 1 / -1;
    }

    .probability {
      font-size: 13px;
      color: var(--muted);
    }

    .probability strong {
      display: block;
      color: var(--text);
      font-size: 26px;
      margin-top: 2px;
    }

    .empty {
      padding: 32px;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .latest {
      margin-bottom: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      max-height: 142px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .latest-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 130px 150px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .latest-row:first-child { border-top: 0; }

    .latest-main {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .latest-time {
      color: var(--muted);
      text-align: right;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.72);
      z-index: 50;
    }

    .modal.open { display: grid; }

    .modal-panel {
      width: min(1120px, 96vw);
      max-height: 92vh;
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .modal-body {
      padding: 14px;
      background: #0f172a;
    }

    .modal-body img,
    .modal-body video {
      width: 100%;
      max-height: 76vh;
      object-fit: contain;
      background: #000000;
      border-radius: 6px;
    }

    .player-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      color: #e5e7eb;
      font-size: 13px;
    }

    .progress {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #334155;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
    }

    .player-meta {
      color: #cbd5e1;
      font-size: 12px;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main { padding: 16px; }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .columns {
        grid-template-columns: 1fr;
      }

      .event {
        grid-template-columns: 1fr;
      }

      .latest-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .latest-time { text-align: left; }

    }
  </style>
</head>
<body>
  <header>
    <h1>Community Fall Monitor</h1>
    <div class="connection"><span id="dot" class="dot"></span><span id="connectionText">Connecting</span></div>
  </header>

  <main>
    <section class="summary">
      <div class="metric"><div class="label">Total Events</div><div id="totalCount" class="value">0</div></div>
      <div class="metric"><div class="label">Open Alerts</div><div id="openCount" class="value">0</div></div>
      <div class="metric"><div class="label">Fall</div><div id="fallCount" class="value">0</div></div>
      <div class="metric"><div class="label">Suspected</div><div id="suspectedCount" class="value">0</div></div>
    </section>

    <div class="toolbar">
      <h2>Incoming Events</h2>
      <button id="reloadButton">Manual Sync</button>
    </div>

    <section id="latestEvents" class="latest">
      <div class="empty">No events received.</div>
    </section>

    <section class="columns">
      <div class="column">
        <div class="column-header">
          <h3>Suspected</h3>
          <span id="suspectedColumnCount" class="column-count">0 active</span>
        </div>
        <div id="suspectedEvents" class="events">
          <div class="empty">No suspected events.</div>
        </div>
      </div>
      <div class="column">
        <div class="column-header">
          <h3>Fall</h3>
          <span id="fallColumnCount" class="column-count">0 active</span>
        </div>
        <div id="fallEvents" class="events">
          <div class="empty">No fall alerts.</div>
        </div>
      </div>
    </section>
  </main>

  <div id="videoModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Event video</div>
        <button id="modalClose">Close</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const suspectedEventsEl = document.getElementById('suspectedEvents');
    const fallEventsEl = document.getElementById('fallEvents');
    const latestEventsEl = document.getElementById('latestEvents');
    const suspectedColumnCountEl = document.getElementById('suspectedColumnCount');
    const fallColumnCountEl = document.getElementById('fallColumnCount');
    const dotEl = document.getElementById('dot');
    const connectionTextEl = document.getElementById('connectionText');
    const reloadButton = document.getElementById('reloadButton');
    const videoModal = document.getElementById('videoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');
    const counts = {
      total: document.getElementById('totalCount'),
      open: document.getElementById('openCount'),
      fall: document.getElementById('fallCount'),
      suspected: document.getElementById('suspectedCount')
    };

    let events = [];
    let socket = null;
    let reconnectTimer = null;
    const frameCache = new Map();
    let player = {
      timer: null,
      frames: [],
      frameIndex: 0,
      frameCount: 0,
      fps: 30,
      playing: false
    };

    function setConnection(online, text) {
      dotEl.className = 'dot ' + (online ? 'online' : 'offline');
      connectionTextEl.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function formatProb(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'n/a';
      return Number(value).toFixed(3);
    }

    function upsertEvent(event) {
      const index = events.findIndex((item) => item.event_id === event.event_id);
      if (index >= 0) {
        events[index] = event;
      } else {
        events.unshift(event);
      }
      render();
    }

    function canReleaseVideo(event) {
      if (event.video_released || !event.video_release_at) return false;
      return Date.now() >= Date.parse(event.video_release_at);
    }

    function hasVideoCountdown(event) {
      if (event.video_released || !event.video_release_at) return false;
      return Date.now() < Date.parse(event.video_release_at);
    }

    function handleRemaining(event) {
      if (!event.handle_due_at || event.handled) return 0;
      return Math.max(0, Math.ceil((Date.parse(event.handle_due_at) - Date.now()) / 1000));
    }

    function isHandlePending(event) {
      return handleRemaining(event) > 0;
    }

    function hasHandleTimer(event) {
      return Boolean(event.handle_due_at && !event.handled);
    }

    function isEffectivelyHandled(event) {
      return event.handled || Boolean(event.handle_due_at && Date.now() >= Date.parse(event.handle_due_at));
    }

    function render() {
      const openEvents = events.filter((event) => !isEffectivelyHandled(event));
      counts.total.textContent = events.length;
      counts.open.textContent = openEvents.length;
      counts.fall.textContent = events.filter((event) => event.status === 'fall').length;
      counts.suspected.textContent = events.filter((event) => event.status === 'suspected').length;

      latestEventsEl.innerHTML = renderLatest(events.slice(0, 6));
      const suspectedEvents = events.filter((event) => event.status === 'suspected' && !isEffectivelyHandled(event));
      const fallEvents = events.filter((event) => event.status === 'fall' && !isEffectivelyHandled(event));
      suspectedColumnCountEl.textContent = `${suspectedEvents.length} active`;
      fallColumnCountEl.textContent = `${fallEvents.length} active`;
      suspectedEventsEl.innerHTML = renderList(suspectedEvents, 'No suspected events.');
      fallEventsEl.innerHTML = renderList(fallEvents, 'No fall alerts.');
      prefetchReleasedVideos();
    }

    function renderLatest(list) {
      if (!list.length) {
        return '<div class="empty">No events received.</div>';
      }
      return list.map((event) => {
        const status = event.status || 'suspected';
        const classifier = event.classifier || {};
        const llm = event.llm_review || {};
        const title = event.status === 'normal'
          ? 'Reviewed as normal'
          : event.status === 'fall'
            ? 'Fall alert'
            : 'Suspected alert';
        const detail = `${event.address || 'local demo'} · ${llm.status || 'no review'} · ${llm.reason || ''}`;
        return `
          <div class="latest-row">
            <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
            <div class="latest-main"><strong>${escapeHtml(title)}</strong> ${escapeHtml(detail)}</div>
            <div>p_fall <strong>${formatProb(classifier.p_fall)}</strong></div>
            <div class="latest-time">${escapeHtml(event.updated_at || event.timestamp || '')}</div>
          </div>
        `;
      }).join('');
    }

    function renderList(list, emptyText) {
      if (!list.length) {
        return `<div class="empty">${escapeHtml(emptyText)}</div>`;
      }
      return list.map((event) => {
        const status = event.status || 'suspected';
        const llm = event.llm_review || {};
        const classifier = event.classifier || {};
        const handled = isEffectivelyHandled(event) ? ' handled' : '';
        const clip = renderVideoPane(event);
        const handledBadge = isEffectivelyHandled(event) ? '<span class="badge handled">Handled</span>' : '';
        const actions = renderActions(event);

        return `
          <article class="event ${escapeHtml(status)}${handled}">
            <div>${clip}</div>
            <div class="event-main">
              <div class="row">
                <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
                ${handledBadge}
                <span class="event-title">${escapeHtml(event.address)}</span>
              </div>
              <div class="grid">
                <div>Client <strong>${escapeHtml(event.client_id)}</strong></div>
                <div>Device <strong>${escapeHtml(event.device_id)}</strong></div>
                <div>Time <strong>${escapeHtml(event.timestamp)}</strong></div>
                <div>Event <strong>${escapeHtml(event.event_id)}</strong></div>
                <div>Scenario <strong>${escapeHtml(event.scenario ?? 'n/a')}</strong></div>
                <div>Frame <strong>${escapeHtml(event.frame_index ?? 'n/a')}</strong></div>
              </div>
              <div class="reason"><strong>Qwen3-VL:</strong> ${escapeHtml(llm.status ?? 'n/a')} (${formatProb(llm.confidence)}) - ${escapeHtml(llm.reason ?? '')}</div>
            </div>
            <div class="event-actions">
              <div class="probability">3D classifier p_fall <strong>${formatProb(classifier.p_fall)}</strong></div>
              ${actions}
            </div>
          </article>
        `;
      }).join('');
    }

    function renderVideoPane(event) {
      const releasedClip = event.clip_url || (event.video_released ? event._clip_url_raw : null);
      if (releasedClip) {
        return `
          <button class="video-button" data-open-video="${escapeHtml(event.event_id)}">
            <span><strong>Open video</strong>Click to view event clip</span>
          </button>
        `;
      }
      return '<div class="empty-video">No video released</div>';
    }

    function renderActions(event) {
      if (isEffectivelyHandled(event)) return '<button disabled>Handled</button>';
      if (event.status === 'fall') {
        const remaining = handleRemaining(event);
        if (remaining > 0) {
          return `<button class="warn" data-handle="${escapeHtml(event.event_id)}">Cancel handle · ${remaining}s</button>`;
        }
        return `<button class="danger" data-handle="${escapeHtml(event.event_id)}">Mark handled</button>`;
      }
      const llm = event.llm_review || {};
      if (llm.status === 'pending_review' || !event._clip_url_raw) {
        return '<button class="pending" disabled>LLM reviewing</button>';
      }
      if (!event.clip_url && !event.clip_stream_url && event._clip_url_raw) {
        if (event.video_release_at) {
          const remaining = Math.max(0, Math.ceil((Date.parse(event.video_release_at) - Date.now()) / 1000));
          if (remaining > 0) {
            return `<button class="pending" disabled>Video in ${remaining}s</button>`;
          }
          return `<button class="primary" data-release-video="${escapeHtml(event.event_id)}">View video</button>`;
        }
        return `<button class="primary" data-request-video="${escapeHtml(event.event_id)}">Request video</button>`;
      }
      const remaining = handleRemaining(event);
      if (remaining > 0) {
        return `<button class="suspect-warn" data-handle="${escapeHtml(event.event_id)}">Cancel handle · ${remaining}s</button>`;
      }
      return `<button class="suspect" data-handle="${escapeHtml(event.event_id)}">Mark handled</button>`;
    }

    async function reloadEvents() {
      const response = await fetch('/api/events');
      const data = await response.json();
      events = data.events || [];
      render();
    }

    async function markHandled(eventId) {
      await fetch(`/api/events/${encodeURIComponent(eventId)}/handled`, { method: 'POST' });
    }

    async function requestVideo(eventId) {
      await fetch(`/api/events/${encodeURIComponent(eventId)}/request-video`, { method: 'POST' });
    }

    async function releaseVideo(eventId) {
      const response = await fetch(`/api/events/${encodeURIComponent(eventId)}/release-video`, { method: 'POST' });
      const data = await response.json();
      if (data.event) {
        upsertEvent(data.event);
        openVideo(data.event.event_id);
      }
    }

    function prefetchReleasedVideos() {
      events
        .filter((event) => (event.clip_url || (event.video_released && event._clip_url_raw)) && !frameCache.has(event.event_id))
        .slice(0, 8)
        .forEach((event) => {
          ensureVideoFrames(event.event_id).catch(() => {});
        });
    }

    async function ensureVideoFrames(eventId) {
      const cached = frameCache.get(eventId);
      if (cached) return cached;
      const pending = fetch(`/api/events/${encodeURIComponent(eventId)}/clip-frames`)
        .then((response) => response.json())
        .then((data) => {
          if (!data.ok) throw new Error(data.error || 'video unavailable');
          const mime = data.mime || 'image/jpeg';
          const frames = (data.frames || []).map((frame) => `data:${mime};base64,${frame}`);
          const loaded = { meta: data.meta || {}, frames };
          frameCache.set(eventId, loaded);
          return loaded;
        })
        .catch((error) => {
          frameCache.delete(eventId);
          throw error;
        });
      frameCache.set(eventId, pending);
      return pending;
    }

    async function openVideo(eventId) {
      const event = events.find((item) => item.event_id === eventId);
      if (!event) return;
      const clipUrl = event.clip_url || (event.video_released ? event._clip_url_raw : null);
      if (!clipUrl) return;
      modalTitle.textContent = `${event.status || 'event'} · ${event.address || event.event_id}`;
      modalBody.innerHTML = '<div class="empty-video">Loading video...</div>';
      videoModal.classList.add('open');
      videoModal.setAttribute('aria-hidden', 'false');
      const data = await ensureVideoFrames(eventId);
      const meta = data.meta || {};
      player = {
        timer: null,
        frames: data.frames || [],
        frameIndex: 0,
        frameCount: Math.max(1, (data.frames || []).length),
        fps: Math.max(1, Number(meta.fps || 30)),
        playing: true
      };
      modalBody.innerHTML = `
        <img id="modalFrame" alt="event video frame">
        <div class="player-controls">
          <button id="playPauseButton" class="primary">Pause</button>
          <div class="progress" aria-label="video progress"><div id="progressFill" class="progress-fill"></div></div>
          <div id="frameCounter">0 / ${player.frameCount}</div>
        </div>
        <div class="player-meta">
          clip ${escapeHtml(meta.start_timestamp_sec ?? 'n/a')}s-${escapeHtml(meta.end_timestamp_sec ?? 'n/a')}s ·
          frames ${escapeHtml(meta.start_frame ?? 'n/a')}-${escapeHtml(meta.end_frame ?? 'n/a')} ·
          ${escapeHtml(meta.frame_count ?? 'n/a')} frames @ ${escapeHtml(meta.fps ?? 'n/a')} fps
        </div>
      `;
      document.getElementById('playPauseButton').addEventListener('click', togglePlayer);
      renderPlayerFrame();
      startPlayer();
    }

    function closeVideo() {
      stopPlayer();
      player = { timer: null, frames: [], frameIndex: 0, frameCount: 0, fps: 30, playing: false };
      videoModal.classList.remove('open');
      videoModal.setAttribute('aria-hidden', 'true');
      modalBody.innerHTML = '';
    }

    function renderPlayerFrame() {
      const frame = document.getElementById('modalFrame');
      const progress = document.getElementById('progressFill');
      const counter = document.getElementById('frameCounter');
      if (!frame || !progress || !counter || !player.frames.length) return;
      frame.src = player.frames[player.frameIndex];
      const percent = ((player.frameIndex + 1) / player.frameCount) * 100;
      progress.style.width = `${Math.max(0, Math.min(100, percent))}%`;
      counter.textContent = `${player.frameIndex + 1} / ${player.frameCount}`;
    }

    function stepPlayer() {
      if (!player.playing || !player.frames.length) return;
      player.frameIndex = (player.frameIndex + 1) % player.frameCount;
      renderPlayerFrame();
    }

    function startPlayer() {
      stopPlayer();
      player.playing = true;
      player.timer = setInterval(stepPlayer, 1000 / player.fps);
      const button = document.getElementById('playPauseButton');
      if (button) button.textContent = 'Pause';
    }

    function stopPlayer() {
      if (player.timer) {
        clearInterval(player.timer);
        player.timer = null;
      }
      player.playing = false;
      const button = document.getElementById('playPauseButton');
      if (button) button.textContent = 'Play';
    }

    function togglePlayer() {
      if (player.playing) {
        stopPlayer();
      } else {
        startPlayer();
      }
    }

    function connect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${scheme}://${location.host}/ws/dashboard`);
      socket.onopen = () => setConnection(true, 'Connected');
      socket.onclose = () => {
        setConnection(false, 'Disconnected, retrying');
        reconnectTimer = setTimeout(connect, 1200);
      };
      socket.onerror = () => setConnection(false, 'Connection error');
      socket.onmessage = (message) => {
        const data = JSON.parse(message.data);
        if (data.type === 'snapshot') {
          events = data.events || [];
          render();
        } else if (data.type === 'event') {
          upsertEvent(data.event);
        } else if (data.type === 'handled') {
          upsertEvent(data.event);
        }
      };
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-handle]');
      if (button) markHandled(button.dataset.handle);
      const requestButton = event.target.closest('[data-request-video]');
      if (requestButton) requestVideo(requestButton.dataset.requestVideo);
      const releaseButton = event.target.closest('[data-release-video]');
      if (releaseButton) releaseVideo(releaseButton.dataset.releaseVideo);
      const openButton = event.target.closest('[data-open-video]');
      if (openButton) openVideo(openButton.dataset.openVideo);
    });

    modalClose.addEventListener('click', closeVideo);
    videoModal.addEventListener('click', (event) => {
      if (event.target === videoModal) closeVideo();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeVideo();
    });

    reloadButton.addEventListener('click', reloadEvents);
    setInterval(() => {
      if (events.some((event) => canReleaseVideo(event) || hasVideoCountdown(event) || hasHandleTimer(event))) render();
    }, 1000);
    reloadEvents().catch(() => {});
    connect();
  </script>
</body>
</html>
